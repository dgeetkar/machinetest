name: Deploy Angular App to S3 Bucket and CloudFront

on:
  push:
    branches:
      - angular-build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install

    - name: Build Angular app
      run: npm run build -- --output-path=dist/angular-app

    - name: List the dir
      run: |
        ls -ltr
        cd dist
        ls -ltr
     
